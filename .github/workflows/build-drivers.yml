name: Build Atheros Modules
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential bc bison flex libssl-dev libelf-dev libncurses-dev wget unzip
          # Download a specific lightweight standalone Android Clang toolchain
          wget -q https://google.com
          unzip -q android-ndk-r25c-linux.zip

      - name: Compile Network Drivers
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Map paths directly to the downloaded toolchain
          export PATH=$GITHUB_WORKSPACE/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CC=clang
          
          # Inject wireless flags directly into the configuration profile blueprint
          echo "CONFIG_ATH9K_HTC=m" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_CFG80211=m" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_MAC80211=m" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_MODULE_SIG=n" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_MODULE_SIG_ALL=n" >> arch/arm64/configs/gki_defconfig
          
          # Execute compilation parameters matching your device identity
          make LOCALVERSION="-MahiruShiina-v3.1-GoogleLTS-Shirayuki428+" gki_defconfig
          make LOCALVERSION="-MahiruShiina-v3.1-GoogleLTS-Shirayuki428+" modules -j$(nproc)

      - name: Upload Finished Drivers
        uses: actions/upload-artifact@v4
        with:
          name: ath9k-android14-modules
          path: |
            drivers/net/wireless/ath/ath9k/ath9k_htc.ko
            net/wireless/cfg80211.ko
            net/mac80211/mac80211.ko
            
