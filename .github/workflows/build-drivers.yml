name: Build Atheros Modules
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Android NDK Clang
        uses: eehouse/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Compile Network Drivers
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Automatically map the standalone NDK cross-compiler tools path
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CC=clang
          
          # Inject target wireless config flags directly into the profile blueprint
          echo "CONFIG_ATH9K_HTC=m" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_CFG80211=m" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_MAC80211=m" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_MODULE_SIG=n" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_MODULE_SIG_ALL=n" >> arch/arm64/configs/gki_defconfig
          
          # Execute the make build parameters using your custom local kernel identity
          make LOCALVERSION="-MahiruShiina-v3.1-GoogleLTS-Shirayuki428+" gki_defconfig
          make LOCALVERSION="-MahiruShiina-v3.1-GoogleLTS-Shirayuki428+" modules -j$(nproc)

      - name: Upload Finished Drivers
        uses: actions/upload-artifact@v4
        with:
          name: ath9k-android14-modules
          path: |
            drivers/net/wireless/ath/ath9k/ath9k_htc.ko
            net/wireless/cfg80211.ko
            net/mac80211/mac80211.ko
            
